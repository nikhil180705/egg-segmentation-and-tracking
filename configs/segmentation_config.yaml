# Classical Segmentation Configuration (Improved v3)
# Used by: task2_classical_segmentation/src/egg_segmenter.py
# Calibrated to eliminate background surfaces, plates, pans, and vegetation false positives.

preprocessing:
  gaussian_blur_kernel: 5       # Must be odd; reduces noise
  gaussian_blur_sigma: 0        # 0 = auto-computed
  use_median_blur: false        # Alternative to Gaussian
  median_blur_kernel: 5
  use_bilateral: true           # Edge-preserving noise reduction
  bilateral_d: 7                # Pixel neighborhood diameter
  bilateral_sigma_color: 50.0   # Color space filter sigma
  bilateral_sigma_space: 50.0   # Coordinate space filter sigma
  use_clahe: true               # Enhance local contrast for shadows / white-on-white
  clahe_clip_limit: 2.5         # Contrast limit factor
  clahe_tile_grid_size: [8, 8]  # Grid size for adaptive equalization

color_space:
  primary_space: "LAB_HSV"
  use_hsv: true
  use_otsu_fallback: true
  use_adaptive: false
  adaptive_block_size: 51
  adaptive_C: -6

  # Non-egg chromaticity rejection (vegetation, blue dishes, dark shadows)
  suppress_green: true
  suppress_blue: true
  suppress_deep_shadow: true

  # Hierarchical Otsu for separating eggs from bright plates / pans / tables
  use_hierarchical_otsu: true
  hierarchical_area_threshold: 75000  # Sub-threshold components larger than this

  # Dual-band egg chromaticity ranges
  white_egg_min_L: 135
  white_egg_max_S: 75
  brown_egg_hsv_ranges:
    h_lower1: 0
    h_upper1: 32
    h_lower2: 165
    h_upper2: 179
    s_min: 25
    s_max: 175
    v_min: 60
    v_max: 220

morphology:
  kernel_shape: "ellipse"
  opening_kernel_size: 5        # Removes small spurious noise blobs
  opening_iterations: 1
  closing_kernel_size: 15       # Fills internal holes from specular highlights
  closing_iterations: 2
  dilation_kernel_size: 3
  dilation_iterations: 1
  fill_holes: true              # Flood fill enclosed interior voids

contour_detection:
  retrieval_mode: "RETR_EXTERNAL"
  approximation: "CHAIN_APPROX_SIMPLE"

  # Area filtering (pixels²) on 640x640 images
  # Eliminates small debris (<1200) and huge plates/pans (>95000)
  min_contour_area: 1200
  max_contour_area: 95000

  # Shape filtering calibrated for convex elliptical eggs
  min_circularity: 0.35         # Rejects irregular / sprawling background blobs
  min_solidity: 0.78            # Eggs are convex; rejects concave dishes/pans
  min_aspect_ratio: 0.45        # Rejects extremely elongated slivers
  max_aspect_ratio: 2.30

  # Border contact safeguards
  max_border_touch_count: 2     # Rejects background frames touching 3 or 4 borders
  max_border_touch_area: 45000  # Rejects large objects touching 2 borders

watershed:
  use_watershed: true
  use_per_component_watershed: true  # Watershed only applied to touching egg clusters
  distance_transform_threshold: 0.40 # Distance transform peak fraction for seed markers
  min_sure_foreground_area: 400      # Minimum area for valid watershed seed
